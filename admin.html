<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIHAD MART Admin</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#22c55e"><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;padding:12px;padding-bottom:90px}.card{background:#1e293b;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid #334155}.btn{padding:13px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;width:100%;margin:6px 0}.green{background:#22c55e;color:#000}.yellow{background:#facc15;color:#000}.red{background:#ef4444;color:#fff}.blue{background:#3b82f6;color:#fff}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff;margin:6px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{background:#0f172a;border-radius:12px;padding:10px;border:1px solid #334155}.prod img,.prod video{width:100%;height:110px;object-fit:cover;border-radius:10px}.tab{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #334155}.tab button{background:none;border:none;color:#94a3b8}.tab button.active{color:#22c55e;font-weight:bold}</style></head><body>
<h1 style="text-align:center;color:#22c55e">💼 JIHAD MART<br><small style="font-size:12px;color:#fff">SUPER ADMIN APP</small></h1>
<div id="wallet" class="card"><h2>💰 Wallet Unlimited</h2><h1 style="text-align:center;font-size:44px" id="bal">৳ 0</h1><div style="display:flex;gap:8px"><button class="btn green" onclick="addBal()">+ ৳5000</button><button class="btn yellow" onclick="withdraw()">Withdraw</button></div><p style="text-align:center">👤 Owner: jihadmart-bd | <span id="showBkash">bKash Not Set</span></p><button class="btn green" onclick="installApp()">📲 ফোনে App Install করুন</button><p style="text-align:center"><a href="index.html" style="color:#facc15">→ দোকানে যান</a></p></div>
<div id="products" class="card" style="display:none"><h2>📦 Product Edit/Add/Delete</h2><input id="pName" placeholder="নাম"><input id="pPrice" type="number" placeholder="দাম"><input id="pImg" placeholder="ছবি/ভিডিও লিংক"><textarea id="pDesc" placeholder="বিবরণ"></textarea><button class="btn green" onclick="addProduct()">✅ Save</button><div id="prodList" class="grid" style="margin-top:10px"></div></div>
<div id="orders" class="card" style="display:none"><h2>🧾 Orders</h2><div id="orderList"></div><button class="btn red" onclick="clearOrders()">সব মুছুন</button></div>
<div id="settings" class="card" style="display:none"><h2>⚙️ Settings</h2><input id="shopName" placeholder="দোকান নাম"><input id="bkash" placeholder="bKash Number"><input id="whatsapp" placeholder="WhatsApp"><button class="btn blue" onclick="saveSettings()">Save</button><button class="btn red" onclick="resetAll()">Reset All</button></div>
<div class="tab"><button onclick="showTab('wallet')" id="btn-wallet" class="active">💰<br>Wallet</button><button onclick="showTab('products')" id="btn-products">📦<br>Product</button><button onclick="showTab('orders')" id="btn-orders">🧾<br>Orders</button><button onclick="showTab('settings')" id="btn-settings">⚙️<br>Settings</button></div>
<script>
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});function installApp(){if(deferredPrompt)deferredPrompt.prompt();else alert('Chrome এর 3 ডট ... > Add to Home Screen > Install চাপুন!');}
let products=JSON.parse(localStorage.getItem('jm_market')||'[{"name":"আতর Oud","price":550,"img":"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400","cat":"islamic","seller":"Admin","type":"image"},{"name":"জায়নামাজ","price":850,"img":"https://images.unsplash.com/photo-1584283627854-3a64cd6a9d2f?w=400","cat":"islamic","seller":"Admin","type":"image"}]');let orders=JSON.parse(localStorage.getItem('jm_orders')||'[]');
function showTab(id){['wallet','products','orders','settings'].forEach(x=>{document.getElementById(x).style.display='none';document.getElementById('btn-'+x).classList.remove('active')});document.getElementById(id).style.display='block';document.getElementById('btn-'+id).classList.add('active');if(id=='products')renderProducts();if(id=='orders')renderOrders();if(id=='wallet')loadBal();}
function loadBal(){document.getElementById('bal').innerText='৳ '+(localStorage.getItem('jihad_wallet')||10000);document.getElementById('showBkash').innerText=localStorage.getItem('jm_bkash')||'Not Set';document.getElementById('bkash').value=localStorage.getItem('jm_bkash')||'';}
function addBal(){let n=parseInt(localStorage.getItem('jihad_wallet')||0)+5000;localStorage.setItem('jihad_wallet',n);loadBal();}function withdraw(){let num=localStorage.getItem('jm_bkash')||prompt('bKash:');let b=localStorage.getItem('jihad_wallet')||0;if(num){alert('Success ৳'+b);localStorage.setItem('jihad_wallet',0);loadBal();}}
function renderProducts(){let h='';products.forEach((p,i)=>{h+=`<div class=prod>${p.type=='video'?`<video src="${p.img}" muted></video>`:`<img src="${p.img}">`}<b>${p.name}</b><p style="color:#22c55e">৳${p.price}</p><button class="btn blue" style="padding:5px" onclick="editP(${i})">Edit</button><button class="btn red" style="padding:5px" onclick="delP(${i})">Del</button></div>`});document.getElementById('prodList').innerHTML=h;localStorage.setItem('jm_market',JSON.stringify(products));}
function addProduct(){let n=pName.value,pr=pPrice.value,im=pImg.value,d=pDesc.value;if(!n||!pr)return alert('নাম দাম দিন');products.push({name:n,price:parseInt(pr),img:im||'https://via.placeholder.com/400',desc:d,cat:'others',seller:'Admin',type:im.includes('.mp4')?'video':'image'});renderProducts();pName.value='';pPrice.value='';pImg.value='';pDesc.value='';alert('Saved!');}
function delP(i){if(confirm('Delete?')){products.splice(i,1);renderProducts()}}function editP(i){let p=products[i];pName.value=p.name;pPrice.value=p.price;pImg.value=p.img;pDesc.value=p.desc;products.splice(i,1);showTab('products');}
function renderOrders(){if(orders.length==0){orderList.innerHTML='No Order';return}let h='';orders.forEach((o,i)=>{h+=`<div style="background:#0f172a;padding:10px;border-radius:10px;margin:6px 0"><b>#${i+1} ${o.name}</b> ৳${o.total}<br>${o.phone||''}<br>${o.date}</div>`});orderList.innerHTML=h;}
function clearOrders(){if(confirm('Clear?')){localStorage.removeItem('jm_orders');orders=[];renderOrders()}}function saveSettings(){localStorage.setItem('jm_bkash',bkash.value);localStorage.setItem('jm_shop',shopName.value);localStorage.setItem('jm_wa',whatsapp.value);alert('Saved');loadBal();}function resetAll(){if(confirm('Reset?')){localStorage.clear();location.reload()}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}loadBal();
</script></body></html>
