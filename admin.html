<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin - Jihad Mart</title><style>body{font-family:sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.card{background:#1e293b;padding:25px;border-radius:15px;width:100%;max-width:400px}h2{text-align:center;color:#22c55e}input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;box-sizing:border-box}button{width:100%;padding:12px;background:#22c55e;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;font-size:16px;margin-top:10px}.wallet{background:#111827;padding:20px;border-radius:12px;text-align:center;margin-top:20px}.balance{font-size:32px;font-weight:700;color:#22c55e}.hidden{display:none}</style></head><body><div class="card" id="loginBox"><h2>JIHAD MART<br>Super Admin</h2><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login as Admin</button></div><div class="card hidden" id="adminBox"><h2>💰 Super Admin Wallet</h2><div class="wallet"><p>মোট জমা (Unlimited)</p><div class="balance" id="bal">৳ 0</div></div><button onclick="addDemo()">+ Demo ৳5000 Add (Test)</button><button onclick="withdraw()" style="background:#facc15">Withdraw to bKash</button><button onclick="logout()" style="background:#334155;color:#fff">Logout</button></div><script>function login(){let u=document.getElementById('user').value,p=document.getElementById('pass').value;if(u==='jihad'&&p==='jihad123'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');loadBal()}else alert('ভুল Username/Password')}function loadBal(){let b=localStorage.getItem('jihad_wallet')||0;document.getElementById('bal').innerText='৳ '+b}function addDemo(){let b=parseInt(localStorage.getItem('jihad_wallet')||0)+5000;localStorage.setItem('jihad_wallet',b);loadBal();alert('৳5000 Add হলো!')}function withdraw(){let n=prompt('bKash Number:');let b=localStorage.getItem('jihad_wallet')||0;if(n){alert('Success! ৳'+b+' '+n+' এ যাবে');localStorage.setItem('jihad_wallet',0);loadBal()}}function logout(){location.reload()}</script></body></html>
