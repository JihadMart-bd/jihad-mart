<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Wallet</title></head><body style="background:#0f172a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px"><div style="background:#1e293b;padding:25px;border-radius:15px;width:100%;max-width:400px;text-align:center"><h2 style="color:#22c55e">💰 JIHAD MART<br>Super Admin Wallet</h2><div style="background:#111827;padding:20px;border-radius:12px;margin:20px 0"><p>আপনার মোট জমা (Unlimited)</p><h1 id="bal" style="color:#22c55e;font-size:36px">৳ 0</h1></div><button onclick="add()" style="width:100%;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;margin:5px 0">+ Demo ৳5000 Add</button><button onclick="wd()" style="width:100%;padding:12px;background:#facc15;border:none;border-radius:8px;font-weight:bold;margin:5px 0">Withdraw to bKash</button><p style="margin-top:20px;font-size:13px;color:#22c55e">✅ You are Owner!</p></div><script>function load(){document.getElementById('bal').innerText='৳ '+(localStorage.getItem('jihad_wallet')||0)}function add(){let n=parseInt(localStorage.getItem('jihad_wallet')||0)+5000;localStorage.setItem('jihad_wallet',n);load();alert('৳5000 Added!')}function wd(){let num=prompt('bKash Number:');let b=localStorage.getItem('jihad_wallet')||0;if(num){alert('Success! ৳'+b+' '+num+' এ যাবে');localStorage.setItem('jihad_wallet',0);load()}}load();</script></body></html>
