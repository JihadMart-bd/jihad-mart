<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jihad Mart - Halal Lifestyle Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind+Siliguri',sans-serif}</style>
</head>
<body class="bg-[#f8faf7]">
<header class="bg-white sticky top-0 z-50 shadow">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<h1 class="text-2xl font-bold text-green-800">JIHAD<span class="text-yellow-600"> MART</span> <span class="text-xs block text-gray-500">HALAL LIFESTYLE</span></h1>
<div class="flex gap-3">
<button class="bg-green-800 text-white px-4 py-2 rounded-full text-sm">🛒 কার্ট (<span id="cartCount">0</span>)</button>
</div>
</div>
</header>

<section class="bg-green-900 text-white py-10 px-4 text-center">
<h2 class="text-3xl font-bold">হালাল ও সুন্নাহ ভিত্তিক জীবনযাত্রা</h2>
<p class="mt-2 text-green-100">১০০% খাঁটি পণ্য - সারা বাংলাদেশে ডেলিভারি</p>
<a href="#products" class="inline-block mt-4 bg-yellow-500 text-black px-6 py-2 rounded-full font-bold">এখনই কেনাকাটা করুন</a>
</section>

<section id="products" class="max-w-7xl mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
</section>

<div id="cartBox" class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.2)] p-4 hidden">
<h3 class="font-bold">আপনার কার্ট</h3>
<div id="cartItems" class="my-2 text-sm"></div>
<button onclick="orderNow()" class="w-full bg-green-800 text-white py-3 rounded-full font-bold">WhatsApp এ অর্ডার করুন</button>
</div>

<script>
const products=[
{name:"প্রিমিয়াম আতর - Oud",price:550,img:"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400"},
{name:"জায়নামাজ - তুর্কি",price:850,img:"https://images.unsplash.com/photo-1585036156171-4853a22d5d9e?w=400"},
{name:"পুরুষ টুপি - সাদা",price:180,img:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400"},
{name:"মধু - সুন্দরবন খাঁটি",price:950,img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=400"},
{name:"খেজুর - আজওয়া",price:1250,img:"https://images.unsplash.com/photo-1551460185-1a6dd0d0a9c2?w=400"},
{name:"বই - রাহে বেলায়াত",price:320,img:"https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400"},
{name:"পাঞ্জাবি - সাদা",price:1450,img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"},
{name:"মেসওয়াক",price:50,img:"https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?w=400"}
];
let cart=[];
const grid=document.getElementById('products');
products.forEach((p,i)=>{
grid.innerHTML+=`<div class="bg-white rounded-2xl p-3 shadow">
<img src="${p.img}" class="h-32 w-full object-cover rounded-xl">
<h3 class="font-bold mt-2 text-sm">${p.name}</h3>
<p class="text-green-700 font-bold">৳${p.price}</p>
<button onclick="addToCart(${i})" class="mt-2 w-full bg-green-800 text-white py-1.5 rounded-full text-sm">কার্টে যোগ করুন</button>
</div>`;
});
function addToCart(i){
cart.push(products[i]);
document.getElementById('cartCount').innerText=cart.length;
document.getElementById('cartBox').classList.remove('hidden');
document.getElementById('cartItems').innerText=cart.map(c=>c.name).join(', ');
}
function orderNow(){
let text=`Assalamualaikum Jihad Mart, ami order korte chai:%0A${cart.map(c=>c.name+' - ৳'+c.price).join('%0A')}`;
window.open('https://wa.me/8801XXXXXXXXX?text='+text,'_blank');
}
</script>
</body>
</html>
